
name: Compiler APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decompresser le projet
        run: |
          mkdir -p projet
          unzip -q Chisana_Nakama_Projet_Android_Studio.zip -d projet
          ls -la projet

      - name: Compiler APK
        run: |
          cd projet/Chisana_Nakama_Android_Studio
          gradle assembleDebug --no-daemon

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Chisana-Nakama-Android
          path: projet/Chisana_Nakama_Android_Studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
